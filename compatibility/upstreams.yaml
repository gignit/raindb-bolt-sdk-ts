# Downstream-owned compatibility lock: the raindb-prime state this bolt SDK's
# wire types + host bindings were reconciled + validated against.
upstreams:
  raindb-prime:
    reconciled_sha: cb445642
    # 2026-09-10 bolt.sdk_pods_reconcile: advanced from 5a7a2177 -> cb445642
    # (planStrategy forward + native writeToken scopeValue + pod listDroplets
    # scopeValue + agent-bridge option reconcile). This reconciliation resolves
    # the previously-noted followup-F debt: the executable live proof now exists
    # for BOTH engines (see live_validation below), not just a coder claim.
    live_validation:
      command: "raindb-test-lightning-goja scripts/run-matrix.sh --profile core.prod.platform-bolts"
      proof: >-
        Parity matrix against the deployed goja host (raindb-prime@cb445642) AND
        the freshly-rolled nodejs-20 pod image (imageId 0b00b196): the three
        reconciliation probes -- sql.planStrategy(range==scan), db.writeToken
        .scopeValue, db.listDroplets.scopeValue -- are ok|ok|SAME on both engines;
        goja=48 ok, pod=48 ok, IDENTICAL; zero engine divergences. This is the
        real-engine executable proof the goja-only coder lock lacked.
      reconciled_shas:
        - raindb-prime@cb445642
        - raindb-lightning-pods@a3d1d4a
        - raindb-test-lightning-goja@a5ba8f1
    validation:
      command: "coder_go_* re-verification of the goja-host boundary + boundary-source diff (peer-reviewed by an independent claude agent, 119 coder tool calls)"
      # BOUNDARY-SOURCE GUARD (widened after peer review): this SDK's Droplet
      # shape is emitted by internal/lightning/sdk_impl.go::dropletToMap (the
      # SINGLE emit point, coder_go_callers: ReadLatest/ReadDroplet/ListDroplets/
      # ListSince) -- NOT bindings.go. So the correct diff guard for "did the
      # consumed boundary change?" is the WHOLE lightning surface, not just
      # bindings.go/podchannel:
      guard_paths:
        - pkg/lightning/
        - internal/lightning/
        # dropletToMap projects into a map[string]any, which ERASES the field
        # type -- so a change to the SOURCE struct types.Droplet.{TS,FloatMeta,...}
        # in pkg/types/droplet.go would compile clean and emit a wrong JS shape
        # WITHOUT any internal/lightning file changing. (Contrast boltDB.ListKeys,
        # which does typed KeyEntry->ListKeyEntry field assignment -> a drift
        # there is a compile error.) So the source struct package MUST be guarded:
        - pkg/types/
      result: >-
        UP TO DATE. Re-verified INDEPENDENTLY with coder (the prior lock was a
        claim from an agent that did not demonstrably use coder; a lock is only
        valid at its reconciled_sha, and HEAD had moved past b87edb5f). The bolt
        SDK's boundary is the goja HOST bridge (ctx.db.*), whose authority is the
        Go host emitters (internal/lightning/sdk_impl.go::dropletToMap +
        pkg/lightning/engines/goja/bindings.go + the pod podchannel), NOT the
        GraphQL SDL. Re-confirmed with coder: (1) git log b87edb5f..d623afa9 over
        the guard_paths above touched NO host emitter -- the consumed boundary is
        unchanged (pkg/sdk/types.go DID change [ReadRelayOptions.Fields->View] but
        it does not reach the bolt-facing shape: there is NO relay host binding at
        all -- relay.* has no installer in bindings.go and no Op* in podchannel,
        and coder_go_references ReadRelayOptions/RelayView show ZERO refs under
        pkg/lightning or internal/lightning. [Note: sdk_impl.go DOES import pkg/sdk
        -- it is the layer that calls sdk.Client -- so the guard is by REACHABILITY
        of the changed symbol to a bolt-facing emitter, not by package.]);
        (2) dropletToMap (sdk_impl.go:1241) emits
        Droplet.TS (Go int64) raw -> JS number, so types/droplet.ts Droplet.ts:
        number is CORRECT; (3) listKeysPageToJS (bindings.go:695-706) emits
        lastModified as time.RFC3339 STRING + etag ONLY when non-empty -> KeyEntry
        .lastModified:string + etag?:string (OPTIONAL) are CORRECT. No shape
        change required.
      evidence:
        - raindb-prime@8f77cf15   # Droplet.ts=number (wire) + KeyEntry.lastModified=string (goja host)
        - "coder_go_callers dropletToMap -> 4 callers all in internal/lightning/sdk_impl.go (the Droplet emit point)"
        - "coder internal/lightning/sdk_impl.go:1241 dropletToMap (Droplet.TS int64 -> JS number)"
        - "coder pkg/lightning/engines/goja/bindings.go:695-706 (lastModified RFC3339 string + etag when non-empty)"
        - "git log b87edb5f..d623afa9 -- pkg/lightning/ internal/lightning/ == empty (no host emitter changed)"
        - raindb-bolt-sdk-ts@2782aea
      scope: >-
        This lock verifies the GOJA host boundary (the emitters in bindings.go +
        sdk_impl.go + the pkg/types source structs they read). POD-engine shape
        parity is NOT verified here: podchannel handleDBListKeys returns the raw
        runtime.ListKeysPage (no json tags), while goja emits a lowercase shape --
        a pod node-SDK may remap it in a third repo. Tracked as R1 in
        raindb-prime docs/followup/tsdk-bolt-sdk-probe-and-sdk-gaps.md. The
        bolt-sdk types are correct for the goja boundary, which is this SDK's
        primary target.
      note: >-
        The unreconciled range b87edb5f..d623afa9 is 42 commits total; the
        consumer-surface subset (godiff --cross-repo-drift) is ~17 (wire/graphql,
        sdk, relay/action, float/cdu) -- ALL are GraphQL-wire / relay-ops /
        typed-error-400-sweep / test / docs changes, NONE crossing the goja-host
        bridge this SDK consumes. No code change required; lock advanced after
        independent coder re-verification + peer review. (etag is OPTIONAL --
        etag?: string -- because the host emits it only when non-empty; that
        optionality is the correct shape.) Validated-By is currently a coder
        re-verification; the executable live case (a probe bolt through the goja
        sandbox) is tracked as followup F -- a known, documented debt.
