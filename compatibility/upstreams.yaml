        pkg/lightning or internal/lightning. [Note: sdk_impl.go DOES import pkg/sdk
        -- it is the layer that calls sdk.Client -- so the guard is by REACHABILITY
        of the changed symbol to a bolt-facing emitter, not by package.]);
        (2) dropletToMap (sdk_impl.go:1241) emits
        Droplet.TS (Go int64) raw -> JS number, so types/droplet.ts Droplet.ts:
        number is CORRECT; (3) listKeysPageToJS (bindings.go:695-706) emits
        lastModified as time.RFC3339 STRING + etag ONLY when non-empty -> KeyEntry
        .lastModified:string + etag?:string (OPTIONAL) are CORRECT. No shape
        change required.
      evidence:
