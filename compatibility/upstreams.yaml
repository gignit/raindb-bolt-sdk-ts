      # consumed boundary change?" is the WHOLE lightning surface, not just
      # bindings.go/podchannel:
      guard_paths:
        - pkg/lightning/
        - internal/lightning/
        # dropletToMap projects into a map[string]any, which ERASES the field
        # type -- so a change to the SOURCE struct types.Droplet.{TS,FloatMeta,...}
