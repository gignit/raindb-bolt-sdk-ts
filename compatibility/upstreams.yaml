        # WITHOUT any internal/lightning file changing. (Contrast boltDB.ListKeys,
        # which does typed KeyEntry->ListKeyEntry field assignment -> a drift
        # there is a compile error.) So the source struct package MUST be guarded:
        - pkg/types/
