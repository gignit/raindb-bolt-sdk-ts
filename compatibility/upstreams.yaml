        - "coder_go_callers dropletToMap -> 4 callers all in internal/lightning/sdk_impl.go (the Droplet emit point)"
        - "coder internal/lightning/sdk_impl.go:1241 dropletToMap (Droplet.TS int64 -> JS number)"
        - "coder pkg/lightning/engines/goja/bindings.go:695-706 (lastModified RFC3339 string + etag when non-empty)"
        - "git log b87edb5f..d623afa9 -- pkg/lightning/ internal/lightning/ == empty (no host emitter changed)"
        - raindb-bolt-sdk-ts@2782aea
